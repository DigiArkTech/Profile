<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">DigiArkTech — Digital Products, Automation and Business Systems</title>
  <desc id="desc">Professional GitHub profile banner for DigiArkTech.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfdff"/>
      <stop offset="52%" stop-color="#edf6ff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="52%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#1d4ed8" stroke-opacity=".052" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1170" cy="55" r="190" fill="#0ea5e9" opacity=".11" filter="url(#glow)"/>
  <circle cx="1290" cy="355" r="190" fill="#8b5cf6" opacity=".10" filter="url(#glow)"/>

  <g transform="translate(84 70)">
    <rect x="0" y="0" width="78" height="78" rx="20" fill="url(#accent)"/>
    <path d="M21 22h36v8H29v9h24v8H29v9h29v8H21z" fill="#ffffff"/>
    <circle cx="65" cy="12" r="4.5" fill="#ffffff" opacity=".95"/>
  </g>

  <text x="84" y="205" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="780" letter-spacing="-2">DigiArkTech</text>
  <rect x="84" y="232" width="480" height="6" rx="3" fill="url(#accent)"/>
  <text x="84" y="287" fill="#1d4ed8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="650">Digital Product &amp; Technology Studio</text>
  <text x="84" y="332" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">
    Software  •  Automation  •  E-commerce  •  Business systems
  </text>

  <g transform="translate(995 151)">
    <rect x="0" y="0" width="305" height="124" rx="23" fill="#ffffff" fill-opacity=".78" stroke="#2563eb" stroke-opacity=".14"/>
    <text x="28" y="40" fill="#2563eb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" letter-spacing="2.4">OUR PURPOSE</text>
    <text x="28" y="76" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650">Turning complex operations</text>
    <text x="28" y="101" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">into practical digital systems.</text>
  </g>
</svg>

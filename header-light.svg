<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Awais Mughal — Technical Product Builder</title>
  <desc id="desc">Professional GitHub profile banner for DigiArkTech.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="55%" stop-color="#edf6ff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#1d4ed8" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1190" cy="70" r="170" fill="#0ea5e9" opacity=".12" filter="url(#glow)"/>
  <circle cx="1290" cy="330" r="180" fill="#8b5cf6" opacity=".11" filter="url(#glow)"/>

  <g transform="translate(84 74)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="url(#accent)"/>
    <path d="M20 22h32v7H27v8h21v7H27v8h26v7H20z" fill="#ffffff"/>
    <circle cx="61" cy="11" r="4" fill="#ffffff" opacity=".95"/>
  </g>

  <text x="84" y="205" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="750" letter-spacing="-1.8">Awais Mughal</text>
  <rect x="84" y="231" width="530" height="6" rx="3" fill="url(#accent)"/>
  <text x="84" y="285" fill="#1d4ed8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="600">Technical Product Builder</text>
  <text x="84" y="330" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">
    Business systems  •  Automation  •  E-commerce  •  AI-assisted development
  </text>

  <g transform="translate(1010 155)">
    <rect x="0" y="0" width="270" height="116" rx="22" fill="#ffffff" fill-opacity=".75" stroke="#2563eb" stroke-opacity=".14"/>
    <text x="28" y="42" fill="#2563eb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2.6">DIGIARKTECH</text>
    <text x="28" y="77" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="650">From complex operations</text>
    <text x="28" y="101" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">to practical software.</text>
  </g>
</svg>
